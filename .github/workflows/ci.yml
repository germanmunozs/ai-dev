# Quality gates of plan.md (T117/T133) and the Git 2.45 minimum (T132).
# macOS runs on APFS; the Linux jobs run their temporary directories on the
# runner's local ext4 disk, so the real-Git acceptance suites run there
# instead of skipping on tmpfs.
name: ci

on:
  # Topic branches are covered by their pull request's run; pushes run CI
  # only on the integration branches, so each change is gated once.
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned by full commit SHA, with the release tag as a
# comment; Dependabot (.github/dependabot.yml) proposes the updates.

# A newer push to the same pull request supersedes its running checks.
# Pushes to dev and main always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Git toolchain
        run: |
          which -a git
          git --version
          git --exec-path
          ls -li "$(command -v git)" "$(git --exec-path)/git"
          echo "system configuration: $(GIT_EDITOR=echo git config --system --edit)"

      - name: Production filesystem for temporary directories
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/go-tmp"
          echo "TMPDIR=$RUNNER_TEMP/go-tmp" >> "$GITHUB_ENV"
          fstype=$(findmnt -n -o FSTYPE -T "$RUNNER_TEMP/go-tmp")
          echo "temporary filesystem: $fstype"
          test "$fstype" = ext4

      - name: Shells for workflow guide paste tests
        if: runner.os == 'Linux'
        run: |
          command -v zsh || { sudo apt-get update && sudo apt-get install -y zsh; }
          zsh --version
          command -v dash

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: |
          go vet ./...
          GOOS=linux go vet ./...

      - name: Cross-builds
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

      - name: Tests
        run: go test -count=1 ./...

      # Feature 014 (research R-08): the oldest supported Neovim and the
      # latest release, each from its GitHub release archive pinned by the
      # SHA-256 of its release asset.
      - name: Install Neovim
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=nvim-linux-x86_64
              digests="v0.11.7=38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991 v0.12.6=474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87"
              verify() { sha256sum -c -; } ;;
            macOS)
              asset=nvim-macos-arm64
              digests="v0.11.7=9c84686ce84bbab725ff3d88ca3ac1d6da5a72128b68d9dd8094e34d4049a126 v0.12.6=1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b"
              verify() { shasum -a 256 -c -; } ;;
          esac
          for entry in $digests; do
            version=${entry%%=*}
            archive="$RUNNER_TEMP/$asset-$version.tar.gz"
            curl -fsSL -o "$archive" "https://github.com/neovim/neovim/releases/download/$version/$asset.tar.gz"
            echo "${entry#*=}  $archive" | verify
            mkdir -p "$RUNNER_TEMP/nvim-$version"
            tar -xzf "$archive" -C "$RUNNER_TEMP/nvim-$version" --strip-components=1
          done

      # Every test that needs Neovim is named TestNvim…; AI_DEV_REQUIRE_NVIM
      # makes a missing or old Neovim a failure instead of a skip.
      - name: Neovim tests
        run: |
          set -euo pipefail
          for version in v0.11.7 v0.12.6; do
            bin="$RUNNER_TEMP/nvim-$version/bin"
            test "$("$bin/nvim" --version | head -1)" = "NVIM $version"
            PATH="$bin:$PATH" AI_DEV_REQUIRE_NVIM=1 go test -race -count=1 -run '^TestNvim' ./...
          done

      - name: Race detector
        run: go test -race -count=3 -timeout 60m ./internal/gitstore ./internal/gitmanager ./internal/gitprocess ./internal/app ./cmd/ai-dev

      - name: Fuzz
        run: |
          go test -run '^$' -fuzz '^FuzzConventionalCommitValidator$' -fuzztime 20s ./internal/conventionalcommit
          go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 20s ./internal/editor
          for target in FuzzWildmatch FuzzCanonicalWriter FuzzAttributeParser FuzzPlanDecoder; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s ./internal/gitmanager
          done

  # Known vulnerabilities in the standard library and in reachable code, and
  # staticcheck's default checks, for Linux and macOS. Both tools are fetched at
  # pinned versions, verified by the Go checksum database; they are never added to
  # go.mod, which holds only the binary's own dependencies.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      # Installed once, so the macOS pass analyzes darwin files with a
      # Linux binary.
      - name: staticcheck
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$RUNNER_TEMP/bin/staticcheck" ./...
          GOOS=darwin "$RUNNER_TEMP/bin/staticcheck" ./...

  # T132 / VER-01: the real-Git suites against Git 2.45.0, the declared
  # minimum in internal/gitprocess/identify.go. The release tarball is
  # pinned by its published SHA-256 and built on the runner. It is
  # installed with prefix /usr/local, one of the verified toolchain layouts
  # of TOOL-01 (configuration and attributes in /usr/local/etc); any other
  # prefix is rightly refused as an unverified layout. `make install`
  # hard-links bin/git to the exec path's git, so direct-mode identification
  # accepts it. The gates job above covers the runners' current Git.
  git-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GIT_VERSION: 2.45.0
      GIT_TARBALL_SHA256: 0aac200bd06476e7df1ff026eb123c6827bc10fe69d2823b4bf2ebebe5953429
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Git ${{ env.GIT_VERSION }} from the verified release tarball
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/git.tar.xz" "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.xz"
          echo "${GIT_TARBALL_SHA256}  $RUNNER_TEMP/git.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/git.tar.xz" -C "$RUNNER_TEMP"
          # Git 2.45 predates C23, which GCC 15 uses by default and whose
          # <stddef.h> defines an unreachable() macro that collides with a
          # Git function; build it as the C17 it was written for.
          options=(prefix=/usr/local CFLAGS="-O2 -std=gnu17" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
            NO_PERL=YesPlease NO_PYTHON=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease)
          make -C "$RUNNER_TEMP/git-${GIT_VERSION}" -j"$(nproc)" "${options[@]}" all
          sudo make -C "$RUNNER_TEMP/git-${GIT_VERSION}" "${options[@]}" install

      - name: Git toolchain
        run: |
          which -a git
          test "$(command -v git)" = /usr/local/bin/git
          test "$(git --version)" = "git version ${GIT_VERSION}"
          test "$(git --exec-path)" = /usr/local/libexec/git-core
          test ! -e /usr/local/etc/gitconfig && test ! -e /usr/local/etc/gitattributes
          git --exec-path
          ls -li "$(command -v git)" "$(git --exec-path)/git"

      - name: Production filesystem for temporary directories
        run: |
          mkdir -p "$RUNNER_TEMP/go-tmp"
          echo "TMPDIR=$RUNNER_TEMP/go-tmp" >> "$GITHUB_ENV"
          fstype=$(findmnt -n -o FSTYPE -T "$RUNNER_TEMP/go-tmp")
          echo "temporary filesystem: $fstype"
          test "$fstype" = ext4

      - name: Real-Git suites on Git ${{ env.GIT_VERSION }}
        run: go test -count=1 -timeout 60m ./internal/gitprocess ./internal/gitmanager ./internal/gitstore ./internal/app ./cmd/ai-dev
